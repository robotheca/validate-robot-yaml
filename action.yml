name: Validate robotheca.yaml
description: Checks a repository's robotheca.yaml (or robot.yaml) against the robotheca.yaml standard of Robotheca, the open robot library.
author: Robotheca
branding:
  icon: check-circle
  color: blue
inputs:
  path:
    description: Where the file is in the repository. Empty, the default, looks for robotheca.yaml, then robot.yaml, at the root.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install the checker (pinned versions)
      shell: bash
      run: npm install --prefix "$GITHUB_ACTION_PATH" --no-save --no-audit --no-fund ajv@8.20.0 ajv-formats@3.0.1 yaml@2.9.1
    - name: Check robotheca.yaml
      shell: bash
      run: node "$GITHUB_ACTION_PATH/validate.mjs" "${{ inputs.path }}"
